<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Periodic Table of Elements</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #171717;
      --bg-mid: #373737;
      --text-light: #BABABA;
      --red-1: #FF2D2D;
      --red-2: #CC2424;
      --orange-1: #FF8C2D;
      --orange-2: #CC7024;
      --green-1: #2DFF6A;
      --green-2: #24CC55;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      background: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
    }

    .header {
      padding: 2rem 1.5rem;
      text-align: center;
      border-bottom: 1px solid var(--bg-mid);
    }

    .header h1 {
      font-weight: 300;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .header p {
      font-size: 0.8rem;
      opacity: 0.6;
      letter-spacing: 0.1em;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      padding: 1rem;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.7rem;
      letter-spacing: 0.05em;
    }

    .legend-dot {
      width: 10px;
      height: 3px;
      border-radius: 1px;
    }

    .filters {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.5rem 1.5rem 1.5rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--bg-mid);
      border: 1px solid transparent;
      color: var(--text-light);
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      padding: 0.4rem 1rem;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .filter-btn:hover { border-color: var(--text-light); }
    .filter-btn.active { border-color: var(--text-light); background: #2a2a2a; }

    .table-container {
      padding: 0 1rem 2rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .periodic-grid {
      display: grid;
      grid-template-columns: repeat(18, minmax(52px, 1fr));
      gap: 3px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .element {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: var(--bg-mid);
      border: 1px solid transparent;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      min-width: 52px;
      min-height: 52px;
    }

    .element:hover {
      transform: scale(1.15);
      z-index: 10;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .element.non-metal { border-left: 2px solid var(--red-1); }
    .element.non-metal:hover { border-color: var(--red-2); box-shadow: 0 0 15px var(--red-2); }

    .element.semi-metal { border-left: 2px solid var(--orange-1); }
    .element.semi-metal:hover { border-color: var(--orange-2); box-shadow: 0 0 15px var(--orange-2); }

    .element.metal { border-left: 2px solid var(--green-1); }
    .element.metal:hover { border-color: var(--green-2); box-shadow: 0 0 15px var(--green-2); }

    .element .number {
      font-size: 0.5rem;
      opacity: 0.5;
      font-weight: 400;
    }

    .element .symbol {
      font-size: clamp(0.9rem, 2vw, 1.3rem);
      font-weight: 500;
      line-height: 1.1;
    }

    .element .name {
      font-size: 0.4rem;
      opacity: 0.4;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .element.empty {
      background: transparent;
      pointer-events: none;
    }

    .element.filtered-out {
      opacity: 0.08;
      pointer-events: none;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--bg-mid);
      border-radius: 4px;
      max-width: 400px;
      width: 100%;
      padding: 2rem;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      color: var(--text-light);
      font-size: 1.2rem;
      cursor: pointer;
      opacity: 0.5;
      transition: opacity 0.2s;
    }

    .modal-close:hover { opacity: 1; }

    .modal .element-number {
      font-size: 0.7rem;
      opacity: 0.5;
    }

    .modal .element-symbol {
      font-size: 3rem;
      font-weight: 500;
      margin: 0.3rem 0;
    }

    .modal .element-name {
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.2rem;
    }

    .modal .element-category {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1.5rem;
    }

    .modal .element-category.non-metal { color: var(--red-1); }
    .modal .element-category.semi-metal { color: var(--orange-1); }
    .modal .element-category.metal { color: var(--green-1); }

    .modal .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
    }

    .modal .detail-item {
      border-top: 1px solid rgba(186,186,186,0.1);
      padding-top: 0.4rem;
    }

    .modal .detail-label {
      font-size: 0.55rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.4;
    }

    .modal .detail-value {
      font-size: 0.85rem;
      font-weight: 400;
    }

    .modal .detail-item.full {
      grid-column: 1 / -1;
    }

    /* Mobile */
    @media (max-width: 768px) {
      .periodic-grid {
        grid-template-columns: repeat(18, 40px);
        gap: 2px;
      }

      .element {
        min-width: 40px;
        min-height: 40px;
      }

      .element .number { font-size: 0.4rem; }
      .element .symbol { font-size: 0.7rem; }
      .element .name { display: none; }
    }

    @media (max-width: 480px) {
      .periodic-grid {
        grid-template-columns: repeat(9, 1fr);
      }

      .row-label { display: none; }
    }

    .hidden { display: none; }
  </style>
</head>

  <header class="header">

    <p>Interactive reference of chemical elements</p>

  <nav class="legend">

      <span>Semi-Metal</span>
    </div>
    <div class="legend-item">

    </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="non-metal">Non-Metals</button>
    <button class="filter-btn" data-filter="semi-metal">Semi-Metals</button>
    <button class="filter-btn" data-filter="metal">Metals</button>

    ];

    const grid = document.getElementById('grid');
    const modal = document.getElementById('modal');

    function buildGrid() {
      grid.innerHTML = '';
      for (let period = 1; period <= 7; period++) {
        for (let group = 1; group <= 18; group++) {
          const el = elements.find(e => e.period === period && e.group === group);
          if (el) {
            const div = document.createElement('div');
            div.className = `element ${el.category}`;
            div.dataset.number = el.number;
            div.dataset.category = el.category;
            div.innerHTML = `
              <span class="number">${el.number}</span>
              <span class="symbol">${el.symbol}</span>
              <span class="name">${el.name}</span>
            `;
            div.addEventListener('click', () => openModal(el));
            grid.appendChild(div);
          } else {
            const empty = document.createElement('div');
            empty.className = 'element empty';
            grid.appendChild(empty);
          }
        }
      }
    }

    function openModal(el) {
      document.getElementById('modalNumber').textContent = el.number;
      document.getElementById('modalSymbol').textContent = el.symbol;
      document.getElementById('modalName').textContent = el.name;

      const cat = document.getElementById('modalCategory');
      cat.textContent = el.category.replace('-', ' ');
      cat.className = `element-category ${el.category}`;

      const details = document.getElementById('modalDetails');
      details.innerHTML = `
        <div class="detail-item">
          <div class="detail-label">Atomic Mass</div>
          <div class="detail-value">${el.mass}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Phase</div>
          <div class="detail-value">${el.phase}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Group</div>
          <div class="detail-value">${el.group}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Period</div>
          <div class="detail-value">${el.period}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Density</div>
          <div class="detail-value">${el.density}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Electron Config</div>
          <div class="detail-value">${el.electron}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Melting Point</div>
          <div class="detail-value">${el.melt}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Boiling Point</div>
          <div class="detail-value">${el.boil}</div>
        </div>
      `;

      modal.classList.add('active');
    }

    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('active');
    });

    document.getElementById('modalClose').addEventListener('click', () => {
      modal.classList.remove('active');
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') modal.classList.remove('active');
    });

    // Filters
    const filterBtns = document.querySelectorAll('.filter-btn');
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filter = btn.dataset.filter;
        document.querySelectorAll('.element').forEach(el => {
          if (filter === 'all') {
            el.classList.remove('filtered-out');
          } else {
            if (el.dataset.category === filter) {
              el.classList.remove('filtered-out');
            } else {
              el.classList.add('filtered-out');
            }
          }
        });
      });
    });

    buildGrid();
  </script>
