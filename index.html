<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Periodic Table of Elements</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg-dark:#171717;--bg-card:#1e1e1e;--text-light:#BABABA;--text-bright:#e0e0e0;--red-1:#FF2D2D;--red-2:#FF6B35;--orange-1:#FF8C2D;--orange-2:#FFB800;--green-1:#2DFF6A;--green-2:#00D4FF}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Outfit',sans-serif;font-weight:300;background:var(--bg-dark);color:var(--text-light);min-height:100vh;overflow-x:hidden}
    body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at 20% 20%,rgba(255,45,45,0.03) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(255,140,45,0.03) 0%,transparent 50%),radial-gradient(ellipse at 50% 80%,rgba(45,255,106,0.03) 0%,transparent 50%);z-index:-1;animation:ambientShift 20s ease-in-out infinite alternate}
    @keyframes ambientShift{0%{transform:translate(0,0) rotate(0deg)}100%{transform:translate(-5%,-5%) rotate(3deg)}}
    .header{padding:3rem 1.5rem 2rem;text-align:center}
    .header h1{font-family:'Space Mono',monospace;font-weight:700;font-size:clamp(1.8rem,5vw,3rem);letter-spacing:0.2em;text-transform:uppercase;background:linear-gradient(135deg,var(--red-1),var(--orange-1),var(--green-1));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:0.5rem}
    .header p{font-size:0.85rem;opacity:0.5;letter-spacing:0.15em;font-weight:200}
    .legend{display:flex;justify-content:center;gap:2rem;padding:1.5rem 1rem;flex-wrap:wrap}
    .legend-item{display:flex;align-items:center;gap:0.6rem;font-size:0.75rem;letter-spacing:0.08em}
    .legend-dot{width:24px;height:4px;border-radius:2px;position:relative}
    .legend-dot::after{content:'';position:absolute;inset:-2px;border-radius:4px;filter:blur(4px);opacity:0.6}
    .legend-dot.red{background:linear-gradient(90deg,var(--red-1),var(--red-2))}.legend-dot.red::after{background:linear-gradient(90deg,var(--red-1),var(--red-2))}
    .legend-dot.orange{background:linear-gradient(90deg,var(--orange-1),var(--orange-2))}.legend-dot.orange::after{background:linear-gradient(90deg,var(--orange-1),var(--orange-2))}
    .legend-dot.green{background:linear-gradient(90deg,var(--green-1),var(--green-2))}.legend-dot.green::after{background:linear-gradient(90deg,var(--green-1),var(--green-2))}
    .search-container{display:flex;justify-content:center;padding:0 1.5rem 1.5rem}
    .search-input{background:rgba(255,255,255,0.03);border:1px solid rgba(186,186,186,0.1);border-radius:25px;padding:0.6rem 1.5rem;color:var(--text-light);font-family:'Outfit',sans-serif;font-size:0.8rem;width:100%;max-width:300px;outline:none;transition:all 0.3s}
    .search-input::placeholder{opacity:0.3}
    .search-input:focus{border-color:rgba(186,186,186,0.3);box-shadow:0 0 20px rgba(186,186,186,0.05)}
    .filters{display:flex;justify-content:center;gap:0.6rem;padding:0.5rem 1.5rem 2rem;flex-wrap:wrap}
    .filter-btn{background:transparent;border:1px solid rgba(186,186,186,0.15);color:var(--text-light);font-family:'Outfit',sans-serif;font-weight:400;font-size:0.7rem;letter-spacing:0.1em;padding:0.5rem 1.2rem;border-radius:20px;cursor:pointer;transition:all 0.3s ease;text-transform:uppercase}
    .filter-btn:hover{border-color:rgba(186,186,186,0.4)}
    .filter-btn.active{border-color:transparent;background:rgba(186,186,186,0.1);color:var(--text-bright)}
    .filter-btn[data-filter="non-metal"].active{border-color:var(--red-1);box-shadow:0 0 15px rgba(255,45,45,0.2)}
    .filter-btn[data-filter="semi-metal"].active{border-color:var(--orange-1);box-shadow:0 0 15px rgba(255,140,45,0.2)}
    .filter-btn[data-filter="metal"].active{border-color:var(--green-1);box-shadow:0 0 15px rgba(45,255,106,0.2)}
    .stats{display:flex;justify-content:center;gap:2rem;padding:0 1.5rem 2rem}
    .stat{text-align:center;font-size:0.75rem;opacity:0.5}
    .stat span{font-family:'Space Mono',monospace;font-weight:700;color:var(--text-bright)}
    .table-container{padding:0 1rem 3rem;overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
    .periodic-grid{display:grid;grid-template-columns:repeat(18,minmax(56px,1fr));gap:6px;max-width:1200px;margin:0 auto}
    .element{aspect-ratio:1;display:flex;flex-direction:column;justify-content:center;align-items:center;background:var(--bg-card);border-radius:12px;cursor:pointer;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);position:relative;min-width:56px;min-height:56px;overflow:hidden}
    .element::before{content:'';position:absolute;inset:0;border-radius:12px;padding:1.5px;background:linear-gradient(135deg,transparent,transparent);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity 0.3s}
    .element::after{content:'';position:absolute;inset:-2px;border-radius:14px;opacity:0;transition:opacity 0.3s;z-index:-1;filter:blur(8px)}
    .element:hover{transform:translateY(-4px) scale(1.08);z-index:10}
    .element:hover::before{opacity:1}
    .element:hover::after{opacity:0.5}
    .element.non-metal::before{background:linear-gradient(135deg,var(--red-1),var(--red-2),var(--red-1));background-size:200% 200%;animation:rgbBorder 3s ease infinite}
    .element.non-metal::after{background:linear-gradient(135deg,var(--red-1),var(--red-2))}
    .element.non-metal:hover{box-shadow:0 8px 30px rgba(255,45,45,0.25),0 0 60px rgba(255,107,53,0.15)}
    .element.semi-metal::before{background:linear-gradient(135deg,var(--orange-1),var(--orange-2),var(--orange-1));background-size:200% 200%;animation:rgbBorder 3s ease infinite}
    .element.semi-metal::after{background:linear-gradient(135deg,var(--orange-1),var(--orange-2))}
    .element.semi-metal:hover{box-shadow:0 8px 30px rgba(255,140,45,0.25),0 0 60px rgba(255,184,0,0.15)}
    .element.metal::before{background:linear-gradient(135deg,var(--green-1),var(--green-2),var(--green-1));background-size:200% 200%;animation:rgbBorder 3s ease infinite}
    .element.metal::after{background:linear-gradient(135deg,var(--green-1),var(--green-2))}
    .element.metal:hover{box-shadow:0 8px 30px rgba(45,255,106,0.25),0 0 60px rgba(0,212,255,0.15)}
    @keyframes rgbBorder{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
    .element .number{font-family:'Space Mono',monospace;font-size:0.5rem;opacity:0.4}
    .element .symbol{font-family:'Outfit',sans-serif;font-size:clamp(1rem,2.2vw,1.5rem);font-weight:600;line-height:1.1;color:var(--text-bright)}
    .element .name{font-size:0.4rem;opacity:0.35;text-transform:uppercase;letter-spacing:0.08em}
    .element.empty{background:transparent;pointer-events:none}
    .element.empty::before,.element.empty::after{display:none}
    .element.filtered-out{opacity:0.05;pointer-events:none;transform:scale(0.9)}
    .element.search-match{animation:searchPulse 1.5s ease infinite}
    @keyframes searchPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);z-index:100;justify-content:center;align-items:center;padding:1rem}
    .modal-overlay.active{display:flex}
    .modal{background:var(--bg-card);border-radius:20px;max-width:420px;width:100%;padding:2.5rem;position:relative;animation:modalIn 0.3s ease;overflow:hidden}
    @keyframes modalIn{from{opacity:0;transform:scale(0.9) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
    .modal::before{content:'';position:absolute;inset:0;border-radius:20px;padding:2px;-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0.5}
    .modal.non-metal::before{background:linear-gradient(135deg,var(--red-1),var(--red-2))}
    .modal.semi-metal::before{background:linear-gradient(135deg,var(--orange-1),var(--orange-2))}
    .modal.metal::before{background:linear-gradient(135deg,var(--green-1),var(--green-2))}
    .modal-close{position:absolute;top:1rem;right:1rem;background:rgba(255,255,255,0.05);border:none;color:var(--text-light);font-size:1.2rem;cursor:pointer;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
    .modal-close:hover{background:rgba(255,255,255,0.1)}
    .modal .element-number{font-family:'Space Mono',monospace;font-size:0.75rem;opacity:0.4}
    .modal .element-symbol{font-family:'Outfit',sans-serif;font-size:4rem;font-weight:700;margin:0.3rem 0;line-height:1}
    .modal.non-metal .element-symbol{color:var(--red-1);text-shadow:0 0 30px rgba(255,45,45,0.4)}
    .modal.semi-metal .element-symbol{color:var(--orange-1);text-shadow:0 0 30px rgba(255,140,45,0.4)}
    .modal.metal .element-symbol{color:var(--green-1);text-shadow:0 0 30px rgba(45,255,106,0.4)}
    .modal .element-name{font-family:'Outfit',sans-serif;font-size:1.2rem;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:0.2rem;color:var(--text-bright)}
    .modal .element-category{font-size:0.65rem;text-transform:uppercase;letter-spacing:0.15em;margin-bottom:1.5rem}
    .modal .element-category.non-metal{color:var(--red-1)}
    .modal .element-category.semi-metal{color:var(--orange-1)}
    .modal .element-category.metal{color:var(--green-1)}
    .modal .details{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
    .modal .detail-item{background:rgba(255,255,255,0.02);border-radius:10px;padding:0.6rem 0.8rem}
    .modal .detail-label{font-size:0.5rem;text-transform:uppercase;letter-spacing:0.1em;opacity:0.35;margin-bottom:0.2rem}
    .modal .detail-value{font-family:'Space Mono',monospace;font-size:0.8rem;color:var(--text-bright)}
    .modal .detail-item.full{grid-column:1/-1}
    @media(max-width:900px){.periodic-grid{grid-template-columns:repeat(18,44px);gap:4px}.element{min-width:44px;min-height:44px;border-radius:10px}.element .number{font-size:0.4rem}.element .symbol{font-size:0.85rem}.element .name{display:none}}
    @media(max-width:600px){.periodic-grid{grid-template-columns:repeat(18,36px);gap:3px}.element{min-width:36px;min-height:36px;border-radius:8px}.element .number{display:none}.element .symbol{font-size:0.7rem}.legend{gap:1rem}.modal{padding:1.5rem;border-radius:16px}.modal .element-symbol{font-size:3rem}}
    @media(max-width:400px){.periodic-grid{grid-template-columns:repeat(9,1fr)}}
    @media(hover:none){.element:active{transform:scale(0.95)}}
  </style>
</head>
<body>
  <header class="header">
    <h1>Periodic Table</h1>
    <p>Interactive reference of chemical elements</p>
  </header>
  <nav class="legend">
    <div class="legend-item"><div class="legend-dot red"></div><span>Non-Metal</span></div>
    <div class="legend-item"><div class="legend-dot orange"></div><span>Semi-Metal</span></div>
    <div class="legend-item"><div class="legend-dot green"></div><span>Metal</span></div>
  </nav>
  <div class="search-container">
    <input type="text" class="search-input" id="searchInput" placeholder="Search elements...">
  </div>
  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="non-metal">Non-Metals</button>
    <button class="filter-btn" data-filter="semi-metal">Semi-Metals</button>
    <button class="filter-btn" data-filter="metal">Metals</button>
  </div>
  <div class="stats">
    <div class="stat"><span id="totalCount">118</span> Elements</div>
    <div class="stat"><span id="visibleCount">118</span> Visible</div>
  </div>
  <div class="table-container">
    <div class="periodic-grid" id="grid"></div>
  </div>
  <div class="modal-overlay" id="modal">
    <div class="modal" id="modalContent">
      <button class="modal-close" id="modalClose">&times;</button>
      <div class="element-number" id="modalNumber"></div>
      <div class="element-symbol" id="modalSymbol"></div>
      <div class="element-name" id="modalName"></div>
      <div class="element-category" id="modalCategory"></div>
      <div class="details" id="modalDetails"></div>
    </div>
  </div>

    const grid=document.getElementById('grid'),modal=document.getElementById('modal');
    function buildGrid(){grid.innerHTML='';for(let p=1;p<=7;p++){for(let g=1;g<=18;g++){const el=E.find(e=>e.p===p&&e.g===g);if(el){const d=document.createElement('div');d.className='element '+el.c;d.dataset.number=el.n;d.dataset.category=el.c;d.innerHTML='<span class="number">'+el.n+'</span><span class="symbol">'+el.s+'</span><span class="name">'+el.nm+'</span>';d.addEventListener('click',()=>openModal(el));grid.appendChild(d)}else{const e=document.createElement('div');e.className='element empty';grid.appendChild(e)}}}}
    function openModal(el){document.getElementById('modalNumber').textContent=el.n;document.getElementById('modalSymbol').textContent=el.s;document.getElementById('modalName').textContent=el.nm;const cat=document.getElementById('modalCategory');cat.textContent=el.c.replace(/-/g,' ');cat.className='element-category '+el.c;const mc=document.getElementById('modalContent');mc.className='modal '+el.c;document.getElementById('modalDetails').innerHTML='<div class="detail-item"><div class="detail-label">Atomic Mass</div><div class="detail-value">'+el.m+'</div></div><div class="detail-item"><div class="detail-label">Phase</div><div class="detail-value">'+el.ph+'</div></div><div class="detail-item"><div class="detail-label">Group</div><div class="detail-value">'+el.g+'</div></div><div class="detail-item"><div class="detail-label">Period</div><div class="detail-value">'+el.p+'</div></div><div class="detail-item"><div class="detail-label">Density</div><div class="detail-value">'+el.d+'</div></div><div class="detail-item"><div class="detail-label">Electron Config</div><div class="detail-value">'+el.e+'</div></div><div class="detail-item"><div class="detail-label">Melting Point</div><div class="detail-value">'+el.mt+'</div></div><div class="detail-item"><div class="detail-label">Boiling Point</div><div class="detail-value">'+el.b+'</div></div>';modal.classList.add('active')}
    modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('active')});
    document.getElementById('modalClose').addEventListener('click',()=>modal.classList.remove('active'));
    document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('active')});
    const filterBtns=document.querySelectorAll('.filter-btn');
    filterBtns.forEach(btn=>{btn.addEventListener('click',()=>{filterBtns.forEach(b=>b.classList.remove('active'));btn.classList.add('active');const f=btn.dataset.filter;let count=0;document.querySelectorAll('.element').forEach(el=>{if(el.classList.contains('empty')){el.classList.remove('filtered-out');return}if(f==='all'||el.dataset.category===f){el.classList.remove('filtered-out');count++}else{el.classList.add('filtered-out')}});document.getElementById('visibleCount').textContent=count})});
    document.getElementById('searchInput').addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.element').forEach(el=>{if(el.classList.contains('empty'))return;const name=el.querySelector('.name').textContent.toLowerCase();const sym=el.querySelector('.symbol').textContent.toLowerCase();const num=el.dataset.number;if(q&&(name.includes(q)||sym.includes(q)||num===q)){el.classList.remove('filtered-out');el.classList.add('search-match')}else if(q){el.classList.add('filtered-out');el.classList.remove('search-match')}else{el.classList.remove('filtered-out','search-match')}})});
    buildGrid();
